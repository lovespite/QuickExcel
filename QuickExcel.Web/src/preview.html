<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="text">QuickExcel 打印预览</title>
<link rel="stylesheet" href="preview.css"><style>
:root{color-scheme:light}html,body,button,input,select{color:#243e3b}
html,body{margin:0;height:100%;font:13px system-ui,sans-serif;overflow:hidden;background:#e6e9ed}header{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid #cbd2d9}button,input,select{font:inherit;padding:5px;border:1px solid #a5afb9;border-radius:3px;background:#fff}button{cursor:pointer}input[type=number]{width:58px}#find{width:130px}#layout{position:absolute;inset:49px 0 26px;display:flex}#thumbnails{width:144px;flex-shrink:0;overflow:auto;background:#f3f4f6;border-right:1px solid #cbd2d9}.thumbnail{display:block;width:128px;height:184px;margin:8px 0;padding:4px;border:none;background:transparent}.thumbnail canvas{display:block;margin:auto;max-width:112px;max-height:160px;box-shadow:0 1px 5px #888}.thumbnail[aria-current=true]{background:#cde9e4}#viewerContainer{position:absolute;inset:0 0 0 145px;overflow:auto;outline:none}#status{position:absolute;bottom:0;height:26px;box-sizing:border-box;padding:5px 12px;left:0;right:0;background:#fff;color:#31504c}#count{min-width:42px}body[data-failed] #layout{opacity:.6;pointer-events:none}@media(max-width:800px){#thumbnails{display:none}#viewerContainer{left:0}#find{width:80px}}
</style></head><body><header aria-label="打印预览工具栏" data-i18n="aria-label"><button id="previous" aria-label="上一页" data-i18n="aria-label">‹</button><input id="page" type="number" value="1" min="1" aria-label="页码" data-i18n="aria-label"><span id="count">/ —</span><button id="next" aria-label="下一页" data-i18n="aria-label">›</button><select id="zoom" aria-label="缩放" data-i18n="aria-label"><option value="page-fit" data-i18n="text">整页</option><option value="page-width" data-i18n="text">页宽</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select><input id="find" type="search" aria-label="查找文本" placeholder="查找文本" data-i18n="aria-label placeholder"><button id="findPrevious" aria-label="上一个匹配" data-i18n="aria-label">↑</button><button id="findNext" aria-label="下一个匹配" data-i18n="aria-label">↓</button><button id="export" data-i18n="text">导出 PDF</button><button id="print" data-i18n="text">打印…</button></header><div id="layout"><aside id="thumbnails" aria-label="页缩略图" data-i18n="aria-label"></aside><div id="viewerContainer" tabindex="0" aria-label="连续页面与可选择文本" data-i18n="aria-label"><div id="viewer" class="pdfViewer"></div></div></div><div id="status" role="status" data-i18n="text">正在加载已生成的 PDF…</div><script type="module" src="preview.js"></script></body></html>
