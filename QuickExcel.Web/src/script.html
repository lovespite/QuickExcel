<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="text">QuickExcel 脚本</title>
<link rel="stylesheet" href="script.css"><style>
html,body{margin:0;height:100%;overflow:hidden;font:13px sans-serif;background:#1e1e1e;color:#cccccc}
body{display:flex;flex-direction:column}#editor{flex:1;min-height:0}
#assistance{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px 8px;background:#181818;border-top:1px solid #2b2b2b}
#status{flex:1;min-width:220px;padding:3px 4px}
button{font:inherit;color:inherit;background:#fff;border:1px solid #b5cdcb;border-radius:3px;padding:4px 7px;cursor:pointer}
button:hover:not(:disabled){background:#dbeae8}button:focus-visible{outline:2px solid #287a72;outline-offset:1px}button:disabled{opacity:.5;cursor:default}
body[data-failed] #editor,body[data-failed] button{pointer-events:none;opacity:.6}
</style></head>
<body><div id="editor" aria-label="脚本编辑器" data-i18n="aria-label"></div>
<div id="assistance" role="group" aria-label="代码提示与静态检查" data-i18n="aria-label">
<div id="status" role="status" title="静态检查使用 QuickExcel API 类型声明；应用脚本时还会进行独立编译检查。" data-i18n="title text">正在准备脚本编辑器…</div>
</div><script type="module" src="script.js"></script></body></html>
