name: Shared rendering
on:
  push:
    paths: ['QuickExcel.Core/**', 'QuickExcel.Rendering*/**', 'third_party/RichTextKit/**', 'scripts/*rendering*', 'scripts/verify-skia-output.py', '.github/workflows/rendering.yml']
  pull_request:
    paths: ['QuickExcel.Core/**', 'QuickExcel.Rendering*/**', 'third_party/RichTextKit/**', 'scripts/*rendering*', 'scripts/verify-skia-output.py', '.github/workflows/rendering.yml']
jobs:
  render:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed test fonts (hash verified)
        shell: pwsh
        run: ./scripts/get-rendering-test-fonts.ps1
      - name: Rendering tests
        run: dotnet test QuickExcel.Rendering.Test/QuickExcel.Rendering.Test.csproj -c Release --artifacts-path artifacts/build --logger trx --results-directory artifacts/rendering-tests
      - name: Headless PNG and PDF
        run: dotnet run --project QuickExcel.Rendering.Smoke/QuickExcel.Rendering.Smoke.csproj -c Release --artifacts-path artifacts/build -- artifacts/rendering-output artifacts/skia-p0/fonts
      - name: Independent final PDF verification
        run: |
          python -m pip install pymupdf==1.26.7 pillow==12.0.0 numpy==2.3.4
          python scripts/verify-skia-output.py artifacts/rendering-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-${{ matrix.os }}
          path: |
            artifacts/rendering-output
            artifacts/rendering-tests
            artifacts/skia-p0/fonts/sources.json
